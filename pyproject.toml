# 打包与依赖声明。
#
# 加这个文件的理由只有一个：**别人 clone 下来要能跑**。在此之前依赖散在
# requirements.txt 里、全用 `>=`，装出来是哪一套版本全看运行的那天 PyPI 上
# 有什么。自己机器上能跑不算数——那只说明自己机器上那套版本能跑。
#
# 分组是按"要做什么"分的，不是按"哪个包"分的：只想跑内核和测试的人不该被
# 拖去装 Qt 和 VTK。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-frame-agent"
version = "0.2.0"
description = "空间刚架智能计算 Agent：自然语言 → 结构模型 → 求解 → 自校验 → 出图"
readme = "README.md"
requires-python = ">=3.10"          # 与 desktop/doctor.py 的 MIN_PYTHON 一致
license = { text = "MIT" }

# 内核：求解、校验、出图、报告。没有这几个什么都跑不了。
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "jsonschema>=4.20",
    "matplotlib>=3.8",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# 桌面端（PySide6 + PyVista 的 CAE 式界面）
desktop = ["PySide6>=6.6", "pyvista>=0.44", "pyvistaqt>=0.11", "vtk>=9.3"]
# 网页端
web = ["streamlit>=1.40", "plotly>=5.20"]
# 节点局部实体子模型：Gmsh 只生成二次四面体网格，刚度与求解均为自研
solid = ["gmsh>=4.11"]
# 接真实大模型（离线测试与演示都不需要）
llm = ["openai>=1.40", "mcp>=2.1"]
dev = ["pytest>=8.0", "ruff>=0.16"]
# 一次装全
all = [
    "space-frame-agent[desktop]",
    "space-frame-agent[web]",
    "space-frame-agent[solid]",
    "space-frame-agent[llm]",
    "space-frame-agent[dev]",
]

[tool.setuptools]
# 源码在 src/ 与 desktop/ 两处，不是标准布局；这里显式列出来，
# 免得 setuptools 去猜（猜错了会把 tests 也打进包里）。
packages = ["desktop"]
py-modules = []

[tool.setuptools.package-dir]
desktop = "desktop"

# --------------------------------------------------------------------------- 静态检查

[tool.ruff]
# 和仓库现有风格一致；E501 没进 select，这个值只影响格式化建议。
line-length = 88
target-version = "py310"

exclude = [
    # 这个脚本跑在 Abaqus 自带的 Python 2.7 里（`print "..."` 是语句不是函数）。
    # 它在本仓库里**不可能**用 Python 3 解析，也不该被要求解析——
    # 排掉它，别让一条永远修不好的报错把整道闸变成噪音。
    "abaqus_bench/extract_odb.py",
]

# 只选"错了就是错了"的两类：E9 语法错误、F pyflakes（未定义名、未用导入、
# 重复定义、未用变量）。第一次跑就是 F821 把 desktop/viewport.py 里一个
# 真 bug 翻出来的——set_result_marker 用了别的方法里的局部 pv，真机上
# 必 NameError，而回归因为跑在 offscreen 下永远碰不到那一行。
#
# 刻意没选的，和理由：
#   B905  zip 不写 strict —— 68 处。strict=True 会在长度不等时抛异常，
#         那是行为改变，不能靠一次批量替换糊上去，得一处处看。
#   （BLE001 原先在这个「没选」清单里，写着"值得专门查一轮"。查完了，
#    34 处逐一看过，现在它在 select 里。留着这段是为了记住结论：其中
#    **一处都没有**真在吞错误——10 处是 MCP 的进程边界、10 处把异常
#    变成了用户看得见的东西、13 处是"不能让它往上传"的隔离，只有
#    viewport._hex_lum 一处该缩窄，已改成 (TypeError, ValueError)。
#    每一处的理由写在各自的 noqa 后面，不是统一一句糊过去。）
#   E7/E402 —— 和这个仓库**有意**的写法打架：icons.py 里
#         `_pin(g, 6, 26); _pin(g, 16, 26)` 三个销一行画完是当一个视觉单元
#         写的；几处模块中段的 import 是为了让重导出挨着解释它的注释。
#   UP/SIM/C4 —— 风格偏好，同上，收益不抵改动量。
#
# 这四类现在是全绿的。**保持全绿**：新增违例要么改代码，要么在那一行写
# `# noqa: XXX` 并说明为什么——别往这个列表里减规则。
[tool.ruff.lint]
select = ["E9", "F", "BLE"]

[tool.ruff.lint.per-file-ignores]
# pytest 的 fixture 用法天生会踩 F811：fixture 从别的测试模块 import 进来，
# 再作为测试函数的形参出现，ruff 只看得见"同名的东西被重新定义了"。
# 这是 pytest 的写法，不是错误。
"tests/test_i18n.py" = ["F811"]
