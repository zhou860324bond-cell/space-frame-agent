[pytest]
# `.` 是仓库根，不能少：desktop 这个包在根目录，不在 src 下。
# 少了它只有一种跑法能成——`python -m pytest` 会把当前目录塞进 sys.path，
# 裸 `pytest`（CI 用的就是这个）不会，于是 18 个桌面端测试模块全都
# ModuleNotFoundError: No module named 'desktop'。
# 写在这里而不是 CI 的环境变量里，是因为这份声明跨平台：写成 PYTHONPATH
# 就要分 `:` 和 `;` 两种分隔符。
pythonpath = . src evalset abaqus_bench
testpaths = tests
addopts = -q
markers =
    gold: Beta 0.1 独立解析真值金标准算例
