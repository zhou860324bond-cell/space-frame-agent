# 自动回归。
#
# 加这个的理由：**"我这边跑过了"不是证据**。测试只有在一台干净机器上、
# 由别人看得见的流程跑过，才算数——PyNite 这类项目的可信度就建立在这一句上。
#
# 四件事是这个仓库特有的、写进 CI 才不会被忘掉：
#
# 1. **无头环境要 QT_QPA_PLATFORM=offscreen**，否则桌面端测试一碰 Qt 就崩。
# 2. **PyVista / VTK / Gmsh 要系统库**（GL、GLU、X 的几个扩展），
#    pip 装的轮子不带这些，缺了会在 import 时就失败。Windows 的轮子自带，
#    所以这一步只在 Linux 上做。
# 3. **实体单元那组测试要 Gmsh**，装不上时它们自己 skip，不该让整条流水线红。
# 4. **必须有一台 Windows**。这个项目的用户全在 Windows（run.bat、build_exe.bat、
#    桌面端都是 Windows 路径），只跑 Linux 等于把目标平台整个放进盲区——
#    换行符那个 bug 就是这么漏过去的：Linux 检出是 LF、CI 永远绿，
#    而按 Git 默认配置 clone 的 Windows 用户一跑就红。
name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          # 目标平台。只跑一个版本是为了省机时——平台差异（路径分隔符、
          # 换行符、编码）跟 Python 小版本没关系，一台就能暴露。
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 装 VTK / Gmsh 需要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 \
            libxinerama1 libxkbcommon-x11-0 libdbus-1-3 xvfb

      - name: 装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6 pyvista pyvistaqt gmsh

      # PYTHONPATH 不在这里设：pytest.ini 里的 `pythonpath = src evalset abaqus_bench`
      # 已经声明了，而且那份声明跨平台（写成 env 就要分 `:` 和 `;` 两种分隔符）。
      - name: 跑全量回归
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: pytest -q

      - name: 桌面端自检（顺带验证入口脚本本身没坏）
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m desktop.doctor || true
