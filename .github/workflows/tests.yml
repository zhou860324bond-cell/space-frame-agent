# 自动回归。
#
# 加这个的理由：**"我这边跑过了"不是证据**。测试只有在一台干净机器上、
# 由别人看得见的流程跑过，才算数——PyNite 这类项目的可信度就建立在这一句上。
#
# 三件事是这个仓库特有的、写进 CI 才不会被忘掉：
#
# 1. **无头环境要 QT_QPA_PLATFORM=offscreen**，否则桌面端测试一碰 Qt 就崩。
# 2. **PyVista / VTK / Gmsh 要系统库**（GL、GLU、X 的几个扩展），
#    pip 装的轮子不带这些，缺了会在 import 时就失败。
# 3. **实体单元那组测试要 Gmsh**，装不上时它们自己 skip，不该让整条流水线红。
name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 装 VTK / Gmsh 需要的系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 \
            libxinerama1 libxkbcommon-x11-0 libdbus-1-3 xvfb

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6 pyvista pyvistaqt gmsh

      - name: 跑全量回归
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src:evalset:abaqus_bench
          MPLBACKEND: Agg
        run: pytest -q

      - name: 桌面端自检（顺带验证入口脚本本身没坏）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m desktop.doctor || true
